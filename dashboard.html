<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Center Dashboard</title>
<style>
:root{color-scheme:light;--bg:#f4f6fb;--c:#fff;--t:#1b2333;--m:#667085;--p:#1e5eff;--b:#e1e6f0;--ok:#0a8a4a;--warn:#b7791f;--info:#0b6fb8;--bad:#d42a2a}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--t)}
.w{max-width:760px;margin:auto;padding:12px 12px 50px}
h1{font-size:19px;margin:0}.sub{color:var(--m);font-size:13px}
a{color:var(--p);text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.btn{padding:9px 13px;border-radius:9px;border:1px solid var(--p);background:#fff;color:var(--p);font-weight:600;cursor:pointer;font-size:14px;display:inline-block;text-align:center}
.btn.f{background:var(--p);color:#fff}.btn.s{padding:6px 10px;font-size:13px}.btn.big{padding:11px 16px;font-size:15px}
.btn:disabled{opacity:.5}
input,select{padding:10px;border:1px solid var(--b);border-radius:9px;background:#fff;color:var(--t);font:inherit;width:100%}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.tabs button{padding:13px 6px;border-radius:12px;border:1.5px solid var(--b);background:#fff;color:var(--t);font-weight:700;font-size:15px;cursor:pointer}
.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.bdg{display:inline-block;min-width:24px;padding:0 7px;margin-left:6px;border-radius:99px;background:var(--bad);color:#fff;font-size:13px;line-height:24px}
.bdg.g{background:var(--ok)}.on .bdg{background:#fff;color:var(--p)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.pill{padding:7px 14px;border-radius:99px;border:1px solid var(--b);background:#fff;color:var(--t);cursor:pointer;font-weight:600;font-size:13px}
.pill.on{background:var(--t);color:#fff;border-color:var(--t)}
.card{background:#fff;border:1px solid var(--b);border-radius:12px;padding:13px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start}
.nm{font-weight:700;font-size:16px}.mt{color:var(--m);font-size:13px;margin-top:2px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid var(--b);margin:0 4px 4px 0}
.s-ok{color:var(--ok);border-color:var(--ok)}.s-warn{color:var(--warn);border-color:var(--warn)}.s-info{color:var(--info);border-color:var(--info)}.s-gr{color:var(--m)}.s-bad{color:var(--bad);border-color:var(--bad)}
.ack{font-family:ui-monospace,monospace;font-size:14px;margin-top:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.empty{text-align:center;color:var(--m);padding:44px 10px;font-size:16px}
.due{margin:0 0 10px;padding:11px 13px;border-radius:11px;font-weight:700;cursor:pointer;border:1.5px solid var(--warn);background:#fff8e8;color:#8a5a00;font-size:15px}
.due.ok{border-color:var(--ok);background:#effaf3;color:var(--ok);cursor:default;font-weight:600}
.big-amt{font-size:26px;font-weight:800;text-align:center;margin:8px 0 2px}
.qb{margin-top:10px;padding:10px;border-radius:10px;border:1.5px solid var(--warn);background:#fff8e8;font-size:14px;font-weight:600}
#lg{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--b);border-radius:14px;padding:18px}
#lg label,.pbox label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
#pm,#qm{position:fixed;inset:0;background:#000b;display:none;overflow:auto;z-index:10;padding:12px}
.pbox{background:#fff;max-width:420px;margin:5vh auto;padding:16px;border-radius:14px;border:1px solid var(--b)}
#qr{display:flex;justify-content:center;margin:12px 0;background:#fff;padding:12px;border-radius:10px;min-height:60px;border:1px solid var(--b)}
</style></head><body>
<div class="w" id="app" style="display:none">
 <div class="top"><div><h1>🏢 <span id="cn">Dashboard</span></h1><div class="sub" id="upd"></div></div>
 <div><a href="index.html" class="btn f s">+ Naya Form</a> <button class="btn s" id="rf">⟳</button> <button class="btn s" id="lo">Logout</button></div></div>
 <div class="due ok" id="due"></div>
 <div class="tabs" id="tabs"></div>
 <input id="q" placeholder="🔎 Naam, mobile ya Ack number">
 <div class="pills" id="pills"></div>
 <div id="list"></div>
</div>
<div id="pm"><div class="pbox">
 <div style="font-size:18px;font-weight:700" id="ptitle">💳 Payment karo</div><div class="big-amt" id="pamt"></div><div class="sub" id="pref" style="text-align:center"></div>
 <div id="qr"></div><div class="sub" id="upiid" style="text-align:center"></div>
 <a id="upib" class="btn f big" style="display:block;text-align:center;margin-top:10px">📱 UPI app se pay karo</a>
 <div style="font-weight:700;margin-top:16px">Payment ke baad ye bharo</div>
 <label>UTR / Transaction number</label><input id="utr" inputmode="numeric" placeholder="12 ank ka UTR number">
 <label>ya Payment ka screenshot</label><input id="ssf" type="file" accept="image/*">
 <div id="pmsg" style="min-height:20px;font-weight:600;margin-top:10px"></div>
 <div class="acts"><button class="btn f big" id="psub" style="flex:1">✔ Payment bhej di</button><button class="btn big" id="pclose">Band karo</button></div>
 <div class="sub" style="margin-top:10px">Owner check karke approve karenge, tab "Payment Done" dikhega.</div>
</div></div>
<div id="qm"><div class="pbox">
 <div style="font-size:18px;font-weight:700">📤 Documents upload karo</div><div class="sub" id="qnm"></div>
 <div class="qb" id="qtxt"></div>
 <label>Photo ya PDF chuno (8 tak)</label><input id="qf" type="file" accept="image/*,application/pdf" multiple>
 <div id="qmsg" style="min-height:20px;font-weight:600;margin-top:10px"></div>
 <div class="acts"><button class="btn f big" id="qsub" style="flex:1">⬆ Bhejo</button><button class="btn big" id="qclose">Band karo</button></div>
</div></div>
<div id="lg">
 <div style="font-size:19px;font-weight:700">🔐 Center Login</div><div id="lm" style="min-height:20px;font-weight:600;margin-top:6px"></div>
 <label>Center ID</label><input id="lid" autocomplete="username" style="text-transform:uppercase" placeholder="C-XXXXXX">
 <label>PIN</label><input id="lpin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="6 ank ka PIN">
 <button class="btn f big" id="lb" style="width:100%;margin-top:14px">Login</button>
 <div class="sub" style="margin-top:12px">ID/PIN bhool gaye ya naya center? <a href="index.html">App me register karo</a></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const SHEET_URL='https://script.google.com/macros/s/AKfycbzhjpoBnoFRetrxUOGUxcFOXKFekJuBE4zlGmKTMyI-wfhYsvoop2er23IE2JBcQqDv/exec';
const $=s=>document.querySelector(s),LBL={PAN:'PAN Card',Voter:'Election',Gazette:'Gazette'},DONEST=/sent|complete|done|deliver/i,PAGE=30;
let TOKEN=localStorage.tok||'',ITEMS=[],PAYI=null,PI=null,QI=null,DUE={total:0,n:0},TAB=(new URLSearchParams(location.search).get('tab')=='pay'?'pay':'pending'),SV='',LIM=PAGE,LAST=0,BUSY=false;
async function api(b,ms){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),ms||40000);try{const r=await fetch(SHEET_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b),signal:ac.signal});const tx=await r.text();try{return JSON.parse(tx)}catch(e){throw new Error('Server ne galat jawab diya')}}finally{clearTimeout(t)}}
function mk(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function fmt(ts){return ts?new Date(ts).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):''}
const rs=n=>'₹'+Number(n||0).toLocaleString('en-IN');
function drawDue(){const d=$('#due');if(DUE.n>0){d.className='due';d.textContent='💰 Baaki payment: '+rs(DUE.total)+' ('+DUE.n+' entries) ›';d.onclick=()=>{TAB='pay';LIM=PAGE;draw();window.scrollTo(0,0)}}else{d.className='due ok';d.textContent='✅ Koi payment baaki nahi';d.onclick=null}}
const eligPay=()=>ITEMS.filter(i=>(i.pay=='Pending'||i.pay=='Rejected')&&i.amt>0);
const qAct=i=>!!i.q&&(i.q.s=='Open'||i.q.s=='Replied');
/* Complete kab: Voter = Ack aa gaya | PAN = Ack aaya aur Sent/Complete | Gazette = Complete/Sent ya Ack */
function isDone(i){if(i.service=='Voter')return !!i.ack;if(i.service=='PAN')return !!i.ack&&DONEST.test(i.status);return !!i.ack||DONEST.test(i.status)}
const payOpen=i=>i.pay!='Done';
function stTag(i){if(i.vs=='Pending'||i.vs=='Review')return['🔍 Document verification me','s-info'];return !i.ack&&!DONEST.test(i.status)?['⏳ Ack baaki','s-warn']:!isDone(i)?['🔄 Process me ('+i.status+')','s-info']:['✅ Complete','s-ok']}
const pCls=p=>p=='Done'?'s-ok':p=='Verify'?'s-info':p=='Rejected'?'s-bad':'s-warn';
const pLbl=p=>p=='Done'?'✅ Payment Done':p=='Verify'?'🔎 Verify ho raha hai':p=='Rejected'?'❌ Payment reject':'💰 Payment baaki';
function lists(){const A=ITEMS.filter(i=>!SV||i.service==SV),q=$('#q').value.trim().toLowerCase(),S=A.filter(i=>!q||(i.name+' '+i.mobile+' '+i.ack).toLowerCase().includes(q));
 const asc=(a,b)=>(a.ts||0)-(b.ts||0),desc=(a,b)=>(b.ts||0)-(a.ts||0);
 return{pending:S.filter(i=>!qAct(i)&&!isDone(i)).sort(asc),done:S.filter(i=>!qAct(i)&&isDone(i)).sort(desc),pay:S.filter(payOpen).sort(asc),qry:S.filter(qAct).sort((a,b)=>(a.q.s=='Open'?0:1)-(b.q.s=='Open'?0:1)||asc(a,b)),
  c:{pending:A.filter(i=>!qAct(i)&&!isDone(i)).length,done:A.filter(i=>!qAct(i)&&isDone(i)).length,pay:A.filter(payOpen).length,qry:A.filter(qAct).length}}}
function card(i,n){const c=mk('div','card'),r=mk('div','row'),l=mk('div'),rt=mk('div');
 l.append(mk('div','nm',(n?n+'. ':'')+(i.name||'(naam nahi)')));const m=mk('div','mt');const a=mk('a',null,i.mobile||'');if(i.mobile)a.href='tel:'+String(i.mobile).replace(/\D/g,'');m.append(a);m.append(' · '+fmt(i.ts));l.append(m);
 rt.append(mk('span','tag',LBL[i.service]||i.service));if(/correction/i.test(i.type))rt.append(mk('span','tag s-warn','Correction'));const st=stTag(i);if(i.amt>0)rt.append(mk('span','tag s-ok',rs(i.amt)));rt.append(mk('span','tag '+st[1],st[0]),mk('span','tag '+pCls(i.pay),pLbl(i.pay)));r.append(l,rt);c.append(r);
 const k=mk('div','ack');if(i.ack){k.append('Ack: ',mk('b',null,i.ack));const b=mk('button','btn s','Copy');b.style.marginLeft='8px';b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(i.ack);b.textContent='✔'};k.append(b)}else k.append(mk('span','mt','Ack Number abhi nahi aaya'));c.append(k);
 if(qAct(i)){const d=mk('div','qb');d.append(mk('div',null,'❓ Query: '+i.q.t));const x=mk('div','acts');if(i.q.s=='Replied')x.append(mk('span','mt','✅ '+i.q.n+' file bhej di hain, owner check kar rahe hain'));const b=mk('button','btn f',i.q.s=='Open'?'📤 Documents upload karo':'📤 Aur documents bhejo');b.onclick=()=>openQ(i);x.append(b);d.append(x);c.append(d)}
 if(i.pay=='Pending'||i.pay=='Rejected'){if(i.amt>0){const x=mk('div','acts'),b=mk('button','btn f big','💳 Payment karo ('+rs(i.amt)+')');b.onclick=()=>openPay([i]);x.append(b,mk('span','mt','Cash diya ho to owner approve karenge'));c.append(x)}else c.append(mk('div','mt','⏳ Amount abhi set nahi hua. Owner amount set karenge, tab payment ka option aayega'))}
 else if(i.pay=='Verify')c.append(mk('div','mt','🔎 UTR/Screenshot mil gaya, owner ka approval baaki hai'));
 return c}
function draw(){const L=lists(),T=$('#tabs');T.replaceChildren();
 [['pending','⏳ Pending',L.c.pending,0],['done','✅ Completed',L.c.done,1],['pay','💰 Payment baaki',L.c.pay,0],['qry','❓ Query',L.c.qry,0]].forEach(([k,l,n,g])=>{const b=mk('button',TAB==k?'on':'',l);if(n)b.append(mk('span','bdg'+(g?' g':''),n));b.onclick=()=>{TAB=k;LIM=PAGE;draw()};T.append(b)});
 const P=$('#pills');P.replaceChildren();[['','Sab'],['PAN','PAN Card'],['Voter','Election'],['Gazette','Gazette']].forEach(([v,l])=>{const b=mk('button','pill'+(SV==v?' on':''),l);b.onclick=()=>{SV=v;LIM=PAGE;draw()};P.append(b)});
 const box=$('#list');box.replaceChildren();const A=L[TAB];
 if(!A.length){box.append(mk('div','empty',TAB=='pending'?'🎉 Koi kaam pending nahi':TAB=='done'?'Abhi koi complete entry nahi':TAB=='pay'?'🎉 Koi payment baaki nahi':'Koi query nahi hai'));return}
if(TAB=='pay'){const E=eligPay();if(E.length){const t=E.reduce((a,x)=>a+x.amt,0),b2=mk('div','card');b2.style.borderColor='var(--p)';b2.append(mk('div','nm','💰 Pura baaki: '+rs(t)+' ('+E.length+' entries)'),mk('div','mt','Ek hi baar me poora payment karna ho to neeche dabao'));const x=mk('div','acts'),bb=mk('button','btn f big','💳 Pura payment ek saath karo');bb.onclick=()=>openPay(E);x.append(bb);b2.append(x);box.append(b2)}}
 const h=mk('div','sub',({pending:'Jo pehle bheja wo sabse upar',done:'Nayi complete entry sabse upar',pay:'Jo pehle bheja wo sabse upar',qry:'Pehle wo jinme aapko documents bhejne hain'})[TAB]+' · '+A.length+' entries');h.style.marginBottom='8px';box.append(h);
 A.slice(0,LIM).forEach((i,k)=>box.append(card(i,TAB=='done'?0:k+1)));
 if(A.length>LIM){const b=mk('button','btn f big','Aur dikhao ('+(A.length-LIM)+' baaki)');b.style.width='100%';b.onclick=()=>{LIM+=PAGE;draw()};box.append(b)}}
/* ---------- payment ---------- */
function openPay(L){PI=L;const tot=L.reduce((a,x)=>a+Number(x.amt||0),0),one=L.length==1,q=$('#qr');$('#pmsg').textContent='';$('#utr').value='';$('#ssf').value='';q.replaceChildren();
 const ref=one?((L[0].service=='Voter'?'ELE':L[0].service.slice(0,3).toUpperCase())+'-'+String(L[0].id).split('_').pop().slice(-5)):('BULK-'+L.length+'ENT');
 $('#ptitle').textContent=one?'💳 Payment karo':'💳 Pura payment ek saath';$('#pamt').textContent=rs(tot);$('#pref').textContent=(one?(L[0].name||''):L.length+' entries ka total')+' · Pay karte waqt remark/note me likho: '+ref;
 const P=PAYI;if(!P||!P.upi){q.append(mk('div','mt','Payment QR abhi set nahi hai. Owner se poochho.'));$('#upib').style.display='none';$('#upiid').textContent=''}
 else{let base=P.link||('upi://pay?pa='+encodeURIComponent(P.upi)+'&pn='+encodeURIComponent(P.name||'')+'&cu=INR');base=base.replace(/([?&])am=[^&]*&?/,'$1').replace(/[?&]$/,'');const link=base+(base.indexOf('?')<0?'?':'&')+'am='+tot.toFixed(2)+'&tn='+encodeURIComponent(ref);
  if(window.QRCode)new QRCode(q,{text:link,width:230,height:230});else q.append(mk('div','mt','QR load nahi hua'));
  $('#upib').href=link;$('#upib').style.display='block';$('#upiid').textContent='UPI ID: '+P.upi}
 $('#pm').style.display='block'}
async function shot(f){const b=await createImageBitmap(f),s=Math.min(1,1000/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*s;c.height=b.height*s;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(x=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(x)},'image/jpeg',.75))}
$('#psub').onclick=async()=>{const m=$('#pmsg'),u=$('#utr').value.trim(),f=$('#ssf').files[0];if(!u&&!f){m.textContent='❌ UTR number ya screenshot dalo';return}m.textContent='⏳ Bhej rahe hain...';$('#psub').disabled=true;
 try{const one=PI.length==1,tot=PI.reduce((a,x)=>a+Number(x.amt||0),0),ss=f?await shot(f):'';const r=await api(one?{a:'pay',t:TOKEN,id:PI[0].id,utr:u,ss}:{a:'payall',t:TOKEN,ids:PI.map(x=>x.id),total:tot,utr:u,ss},90000);if(r.err=='auth'){logout();return}if(!r.ok){m.textContent='❌ '+r.msg;$('#psub').disabled=false;return}m.textContent='✅ Mil gayi. Owner approve karenge tab "Payment Done" dikhega.';setTimeout(()=>{$('#pm').style.display='none';$('#psub').disabled=false;load()},1500)}catch(e){m.textContent='❌ Net ya server ki dikkat, dobara try karo';$('#psub').disabled=false}};
$('#pclose').onclick=()=>{$('#pm').style.display='none'};
/* ---------- query: documents upload ---------- */
function openQ(i){QI=i;$('#qmsg').textContent='';$('#qf').value='';$('#qtxt').textContent='❓ '+i.q.t;$('#qnm').textContent=(i.name||'')+' · '+(LBL[i.service]||i.service);$('#qsub').disabled=false;$('#qm').style.display='block'}
const b64=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(b)});
async function prep(f){if(f.type=='application/pdf'){if(f.size>4.5e6)throw new Error(f.name+': PDF 4.5MB se badi hai');return{n:f.name,t:'application/pdf',d:await b64(f)}}
 if(!f.type.startsWith('image/'))throw new Error(f.name+': sirf photo ya PDF chalegi');
 const bm=await createImageBitmap(f),k=Math.min(1,1800/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
 const bl=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));return{n:f.name.replace(/\.\w+$/,'')+'.jpg',t:'image/jpeg',d:await b64(bl)}}
$('#qclose').onclick=()=>{$('#qm').style.display='none'};
$('#qsub').onclick=async()=>{const m=$('#qmsg'),L=[...$('#qf').files].slice(0,8);if(!L.length){m.textContent='❌ Pehle photo ya PDF chuno';return}$('#qsub').disabled=true;m.textContent='⏳ Taiyar ho raha hai...';
 try{const arr=[];for(const f of L)arr.push(await prep(f));m.textContent='⏳ Bhej rahe hain, window band mat karo...';const r=await api({a:'qup',t:TOKEN,id:QI.id,files:arr},90000);if(r.err=='auth'){logout();return}if(!r.ok){m.textContent='❌ '+r.msg;$('#qsub').disabled=false;return}
  m.textContent='✅ '+r.n+' file mil gayi. Owner check karenge.';setTimeout(()=>{$('#qm').style.display='none';load()},1500)}catch(e){m.textContent='❌ '+(e.message||'Net ya server ki dikkat')+', dobara try karo';$('#qsub').disabled=false}};
/* ---------- load / login ---------- */
async function load(){if(BUSY)return;BUSY=true;$('#upd').textContent='⏳ Load ho raha hai...';
 try{const r=await api({a:'list',t:TOKEN});if(r.err=='auth'){logout();return}if(!r.ok)throw new Error(r.msg||'error');ITEMS=r.items.map(i=>({...i,pay:i.pay||'Pending'}));PAYI=r.pay;DUE=r.due||{total:0,n:0};LAST=Date.now();drawDue();$('#cn').textContent=r.center;$('#upd').textContent='Taaza: '+new Date().toLocaleTimeString('en-IN');draw()}
 catch(e){$('#upd').textContent='⚠️ Load nahi hua, ⟳ dabao'}finally{BUSY=false}}
function logout(){TOKEN='';localStorage.removeItem('tok');localStorage.removeItem('cinfo');show()}
function show(){$('#app').style.display=TOKEN?'block':'none';$('#lg').style.display=TOKEN?'none':'block';if(TOKEN){drawDue();draw();load()}}
$('#lb').onclick=async()=>{const m=$('#lm');m.textContent='⏳ Check ho raha hai...';try{const r=await api({a:'login',id:$('#lid').value,pin:$('#lpin').value});if(!r.ok){m.textContent='❌ '+r.msg;return}TOKEN=r.t;localStorage.tok=TOKEN;localStorage.cinfo=JSON.stringify({id:r.id,name:r.name,email:r.email});$('#lpin').value='';m.textContent='';show()}catch(e){m.textContent='❌ Net ya server ki dikkat'}};
$('#rf').onclick=load;$('#lo').onclick=logout;$('#q').oninput=()=>{LIM=PAGE;draw()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&TOKEN&&Date.now()-LAST>60000)load()});
if(/PASTE/.test(SHEET_URL)){$('#lm').textContent='⚙️ Setup baaki hai: file me SHEET_URL (Web app URL) daalna zaruri hai';$('#lb').disabled=true}
show();
</script></body></html>

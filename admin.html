<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin</title>
<style>
:root{--bg:#f4f6fb;--c:#fff;--t:#1b2333;--m:#667085;--p:#1e5eff;--b:#e1e6f0;--ok:#0a8a4a;--warn:#b7791f;--info:#0b6fb8;--bad:#d42a2a}
@media(prefers-color-scheme:dark){:root{--bg:#121722;--c:#1b2231;--t:#e8ecf5;--m:#9aa6bd;--b:#2e3a52;--ok:#37c783;--warn:#e6b450;--info:#5bb0f0;--bad:#ff6b6b}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--t)}
.w{max-width:820px;margin:auto;padding:12px 12px 60px}
a{color:var(--p);text-decoration:none}
h1{font-size:19px;margin:0}.sub{color:var(--m);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.btn{padding:9px 13px;border-radius:9px;border:1px solid var(--p);background:none;color:var(--p);font-weight:600;cursor:pointer;font-size:14px;display:inline-block;text-align:center}
.btn.f{background:var(--p);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.bad{border-color:var(--bad);color:var(--bad)}.btn.s{padding:6px 10px;font-size:13px}.btn.big{padding:11px 16px;font-size:15px}
.btn:disabled{opacity:.5}
input,select,textarea{padding:10px;border:1px solid var(--b);border-radius:9px;background:var(--c);color:var(--t);font:inherit;width:100%}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:10px 0}
.tabs button{padding:12px 4px;border-radius:12px;border:1.5px solid var(--b);background:var(--c);color:var(--t);font-weight:700;font-size:14px;cursor:pointer;line-height:1.25}
.tabs button.on{background:var(--p);color:#fff;border-color:var(--p)}
.bdg{display:inline-block;min-width:22px;padding:0 7px;margin-left:5px;border-radius:99px;background:var(--bad);color:#fff;font-size:13px;line-height:22px}
.on .bdg{background:#fff;color:var(--p)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pill{padding:7px 13px;border-radius:99px;border:1px solid var(--b);background:var(--c);color:var(--t);cursor:pointer;font-weight:600;font-size:13px}
.pill.on{background:var(--p);color:#fff;border-color:var(--p)}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:flex-start}
.no{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--p);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;margin-right:10px}
.nm{font-weight:700;font-size:16px}.mt{color:var(--m);font-size:13px;margin-top:2px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid var(--b);margin:0 4px 4px 0}
.s-ok{color:var(--ok);border-color:var(--ok)}.s-warn{color:var(--warn);border-color:var(--warn)}.s-info{color:var(--info);border-color:var(--info)}.s-gr{color:var(--m)}.s-bad{color:var(--bad);border-color:var(--bad)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.empty{text-align:center;color:var(--m);padding:40px 10px;font-size:16px}
#lg{max-width:360px;margin:14vh auto;background:var(--c);border:1px solid var(--b);border-radius:14px;padding:18px}
#md{position:fixed;inset:0;background:#000b;display:none;overflow:auto;z-index:20;padding:12px}
.mbox{background:var(--c);max-width:520px;margin:4vh auto;padding:16px;border-radius:14px;border:1px solid var(--b)}
.kv{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--b);font-size:14px}
.kv span:first-child{color:var(--m);flex:0 0 34%}.kv span:nth-child(2){flex:1;word-break:break-word}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;display:none;z-index:50;max-width:90%}
.tag:empty{display:none}
.split{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;align-items:start;margin-top:10px}
.pane{position:sticky;top:0;max-height:92vh;overflow:auto;background:var(--c);z-index:2}
.vw{border:1px solid var(--b);border-radius:10px;padding:6px;min-height:160px;background:var(--bg);text-align:center;overflow:auto;max-height:66vh}
.vw img{display:block;margin:0 auto;border-radius:4px;max-width:none;background:#fff}
.pgw{margin:0 auto 12px;text-align:left}.pgw.sel img{outline:3px solid var(--p)}
.zb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.zb .btn{padding:5px 11px}
.sbar{position:sticky;bottom:0;background:var(--c);padding:10px 0 2px;border-top:1px solid var(--b);margin-top:12px}
@media(max-width:820px){.split{grid-template-columns:1fr}.pane{max-height:56vh;padding-bottom:6px;border-bottom:2px solid var(--b)}.vw{max-height:30vh}}
.chip{display:inline-block;margin:0 6px 6px 0;padding:6px 11px;border-radius:99px;border:1px solid var(--b);background:var(--c);color:var(--t);font-size:13px;cursor:pointer}
.qb{margin-top:8px;padding:8px 10px;border-radius:9px;border:1px solid var(--warn);color:var(--t);font-size:14px;background:rgba(183,121,31,.08)}
.ld{height:3px;background:var(--p);position:fixed;top:0;left:0;width:0;z-index:60;transition:width .4s}
</style></head><body>
<div class="ld" id="ld"></div>
<div id="lg">
 <div style="font-size:19px;font-weight:700">🛡️ Admin Login</div><div id="lm" style="min-height:20px;font-weight:600;margin-top:6px"></div>
 <label>Admin PIN</label><input id="lpin" type="password" autocomplete="current-password" placeholder="Admin PIN">
 <button class="btn f big" id="lb" style="width:100%;margin-top:14px">Login</button>
 <div class="sub" style="margin-top:12px">PIN set nahi kiya? Google Sheet me <b>Admin → Admin PIN set karo</b> chalao.</div>
</div>
<div class="w" id="app" style="display:none">
 <div class="top"><div><h1>🛡️ Admin <span class="sub" id="ver"></span></h1><div class="sub" id="upd"></div></div>
  <div><button class="btn s f" id="ne">➕ Nayi Entry</button> <button class="btn s" id="rf">⟳</button> <button class="btn s" id="lo">Logout</button></div></div>
 <div style="display:flex;gap:6px"><input id="q" placeholder="🔎 Kisi bhi entry ko dhundo (naam / mobile / ack)" style="flex:1"><button class="btn f" id="qb">Dhundo</button></div>
 <div class="tabs" id="tabs"></div>
 <div id="main"></div>
</div>
<div id="md"><div class="mbox" id="mb"></div></div>
<div id="toast"></div>
<script>
const SHEET_URL='https://script.google.com/macros/s/AKfycbzhjpoBnoFRetrxUOGUxcFOXKFekJuBE4zlGmKTMyI-wfhYsvoop2er23IE2JBcQqDv/exec';
const $=s=>document.querySelector(s),LBL={PAN:'PAN Card',Voter:'Election',Gazette:'Gazette'},DONE=/sent|complete|done|deliver/i,PAGE=30;
const FN={name:'Naam',newname:'Naya naam',oldname:'Purana naam',father:'Father',mother:'Mother',spouse:'Husband/Wife',dob:'DOB',mobile:'Mobile',aadhaar:'Aadhaar',address:'Address',flat:'Flat/Door/Building',road:'Road/Street',po:'Post Office',area:'Area/Town',district:'District',state:'State',pincode:'Pincode',gender:'Gender',email:'Email',PAN_No:'Purana PAN',EPIC_No:'Purana EPIC',Center:'Center',Operator:'Operator',Type:'Type'};
let TOKEN=localStorage.atok||'',ITEMS=[],CEN=[],TAB=(new URLSearchParams(location.search).get('tab')=='rev'?'rev':'ver'),BUSY=false,LAST=0,LIM=PAGE,LOADED=false,ERR='',SRVOLD=false;const VER='v10',REQV='v10';
const F={center:'',pay:''};
function mk(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function bt(l,c,fn){const b=mk('button','btn '+(c||''),l);b.type='button';b.onclick=fn;return b}
async function api(b,ms){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),ms||30000);try{const r=await fetch(SHEET_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b),signal:ac.signal});const tx=await r.text();try{return JSON.parse(tx)}catch(e){throw new Error('Server ne galat jawab diya ('+r.status+'): '+tx.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,110))}}catch(e){if(e.name=='AbortError')throw new Error('Server ne bahut der laga di (net slow ya ZIP badi hai), dobara try karo');throw e}finally{clearTimeout(t)}}
async function call(a,x,ms){const r=await api({a,t:TOKEN,...x},ms);if(r.err=='auth'){logout();throw new Error('auth')}return r}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function bar(on){const l=$('#ld');l.style.width=on?'70%':'100%';if(!on)setTimeout(()=>l.style.width='0',400)}
function ago(ts){if(!ts)return'';const m=Math.max(0,Math.round((Date.now()-new Date(ts))/6e4));if(m<2)return'abhi abhi';if(m<60)return m+' min pehle';const h=Math.round(m/60);if(h<24)return h+' ghante pehle';return Math.round(h/24)+' din pehle'}
const old=ts=>ts&&Date.now()-new Date(ts)>864e5;
function copy(t,b){const ok=()=>{if(b){const o=b.textContent;b.textContent='✔';setTimeout(()=>b.textContent=o,900)}else toast('Copy ho gaya')};if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,ok);else{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();ok()}}
const gid=u=>{const m=/\/d\/([^\/?]+)/.exec(u||'')||/[?&]id=([^&]+)/.exec(u||'');return m?m[1]:''};
const zipUrl=u=>gid(u)?'https://drive.google.com/uc?export=download&id='+gid(u):u;
const sCls=s=>DONE.test(s)?'s-ok':/ready|applied|process/i.test(s)?'s-info':/pending|review|received/i.test(s)?'s-warn':/reject|fail/i.test(s)?'s-bad':'s-gr';
const pCls=p=>p=='Done'?'s-ok':p=='Verify'?'s-info':p=='Rejected'?'s-bad':'s-warn';
const pLbl=p=>p=='Done'?'✅ Payment Done':p=='Verify'?'🔎 Verify baaki':p=='Rejected'?'❌ Payment reject':'💰 Payment baaki';
const noAck=i=>!i.ack&&i.status=='Received',payOpen=i=>i.pay!='Done',qAct=i=>i.qs=='Open'||i.qs=='Replied',inVer=i=>i.vs=='Pending',inRev=i=>i.vs=='Review',held=i=>inVer(i)||inRev(i);
function closeM(){$('#md').style.display='none'}
function openM(n,wide){$('#mb').style.maxWidth=wide?'1150px':'520px';$('#mb').replaceChildren(n);$('#md').style.display='block';$('#md').scrollTop=0}
$('#md').onclick=e=>{if(e.target.id=='md')closeM()};

/* ---------- data (sirf pending kaam aata hai) ---------- */
function cacheSave(){try{localStorage.acache=JSON.stringify({items:ITEMS,cen:CEN})}catch(e){}}
async function load(manual){if(BUSY){if(manual)toast('Load ho raha hai, ruko...');return}BUSY=true;bar(true);$('#upd').textContent='⏳ Load ho raha hai...';
 try{const r=await call('alist',{},40000);if(!r.ok)throw new Error(r.msg||'error');ITEMS=r.items.sort((a,b)=>String(a.ts).localeCompare(String(b.ts)));CEN=r.centers;LAST=Date.now();LOADED=true;ERR='';SRVOLD=r.ver!==REQV;cacheSave();$('#upd').textContent='Taaza: '+new Date().toLocaleTimeString('en-IN')+' · poori entries: '+r.total;if($('#md').style.display!='block')render()}
 catch(e){if(e.message!='auth'){ERR=e.name=='AbortError'?'Server ne bahut der laga di (net slow ya pehli baar setup ho raha hai)':(e.message||'Net ki dikkat');$('#upd').textContent='⚠️ '+ERR;if($('#md').style.display!='block')render()}}
 finally{BUSY=false;bar(false);if(!LOADED&&!ERR&&$('#md').style.display!='block')render()}}
async function upd(ids,set,msg){try{const r=await call('aupd',{ids,set});if(!r.ok){toast('❌ '+(r.msg||'error'));return false}
 ITEMS.forEach(i=>{if(!ids.includes(i.id))return;if(set.ack!==undefined){i.ack=set.ack;if(set.ack&&set.status===undefined&&i.status=='Received')i.status='Applied'}if(set.status!==undefined)i.status=set.status||'Received';if(set.pay!==undefined){i.pay=set.pay;if(set.pay=='Done'&&!i.mode&&set.mode===undefined)i.mode='Cash'}if(set.mode!==undefined)i.mode=set.mode;if(set.utr!==undefined)i.utr=set.utr;if(set.amt!==undefined)i.amt=Number(set.amt)});
 ITEMS=ITEMS.filter(i=>noAck(i)||payOpen(i)||qAct(i)||held(i));cacheSave();toast('✅ '+(msg||'Ho gaya'));render();return true}catch(e){if(e.message!='auth')toast('❌ Net ya server ki dikkat, dobara try karo');return false}}

/* ---------- cards ---------- */
function head(i,n){const l=mk('div');l.style.display='flex';if(n){l.append(mk('div','no',n))}const t=mk('div');t.append(mk('div','nm',i.name||'(naam nahi)'));
 const m=mk('div','mt');if(i.mobile){const a=mk('a',null,i.mobile);a.href='tel:'+String(i.mobile).replace(/\D/g,'');m.append(a,' · ')}m.append((i.center||'-')+' · '+(LBL[i.service]||i.service));t.append(m);
 const w=mk('div','mt',(old(i.ts)?'⚠️ ':'⏱ ')+ago(i.ts));if(old(i.ts))w.style.color='var(--bad)';w.style.fontWeight='600';t.append(w);l.append(t);return l}
function zipBtn(i){if(!i.zip)return null;const z=mk('a','btn s','⬇ ZIP');z.href=zipUrl(i.zip);z.target='_blank';z.rel='noopener';return z}
function workCard(i,n){const c=mk('div','card'),r=mk('div','row'),rt=mk('div');r.append(head(i,n),rt);if(/correction/i.test(i.type))rt.append(mk('span','tag s-warn','Correction'));rt.append(mk('span','tag '+pCls(i.pay),pLbl(i.pay)));c.append(r);
 const a=mk('div','acts');a.append(bt('✏️ Ack daalo','f big',()=>ackM(i)),bt('❓ Query','',()=>raiseM(i)),bt('📋 Data','',()=>details(i)),bt('🔁 Review me bhejo','s',()=>revM(i)));const z=zipBtn(i);if(z)a.append(z);c.append(a);return c}
const rs=n=>'₹'+Number(n||0).toLocaleString('en-IN');
function amtTag(i){if(i.own)return null;return i.amt>0?mk('span','tag s-ok',rs(i.amt)):mk('span','tag s-bad','⚠️ Amount set nahi hua')}
async function amtM(i){const v=prompt('Amount (₹) likho'+(i.name?' - '+i.name:''),i.amt||'');if(v===null)return;const t=v.trim();if(!/^\d{1,6}(\.\d{1,2})?$/.test(t)){toast('❌ Amount sahi likho (sirf ank)');return}await upd([i.id],{amt:t},'Amount '+rs(t)+' set ho gaya')}
function verCard(i,n){const c=mk('div','card'),r=mk('div','row'),rt=mk('div');r.append(head(i,n),rt);if(/correction/i.test(i.type))rt.append(mk('span','tag s-warn','Correction'));rt.append(mk('span','tag s-info',i.vs=='Review'?'🔁 Review pending':'🔍 Verification pending'));{const t=amtTag(i);if(t)rt.append(t)}c.append(r);
 const a=mk('div','acts');a.append(bt(i.vs=='Review'?'🔁 Review karo':'🔍 Verify karo','f big',()=>zipEdit(i,i.vs=='Review'?'rev':'ver')),bt('❓ Query','',()=>raiseM(i)));const z=zipBtn(i);if(z)a.append(z);c.append(a);return c}
async function revM(i){if(!confirm('Is entry ko "Review pending" me bhejein?\n\nTab tak yahi se edit ho sakegi. Review ok karne par wapas aage ka kaam me chali jayegi.'))return;
 try{const r=await call('aver',{id:i.id,op:'review'});if(!r.ok){toast('❌ '+(r.msg||'error'));return}i.vs='Review';const k=ITEMS.findIndex(x=>x.id==i.id);if(k>=0)ITEMS[k].vs='Review';else ITEMS.push(i);cacheSave();toast('✅ Review pending me bhej di');render()}catch(e){if(e.message!='auth')toast('❌ Net ya server ki dikkat')}}
function payCard(i,n){const c=mk('div','card'),r=mk('div','row'),rt=mk('div');r.append(head(i,n),rt);{const t=amtTag(i);if(t)rt.append(t)}rt.append(mk('span','tag '+pCls(i.pay),pLbl(i.pay)));if(i.ack)rt.append(mk('span','tag s-ok','Ack aa gaya'));c.append(r);
 if(i.utr||i.mode)c.append(mk('div','mt','UTR: '+(i.utr||'-')+(i.mode?' · '+i.mode:'')));
 const a=mk('div','acts');
 if(i.pay=='Verify'){a.append(bt('✅ Payment mil gaya','ok big',()=>upd([i.id],{pay:'Done'},'Payment Done')),bt('❌ Reject','bad',()=>upd([i.id],{pay:'Rejected'},'Reject kar diya')))}
 else a.append(bt('💵 Cash mila','ok big',()=>upd([i.id],{pay:'Done',mode:'Cash'},'Cash Payment Done')),bt('✅ Online mila','',()=>upd([i.id],{pay:'Done',mode:'Online'},'Payment Done')));
 if(i.proof){const z=mk('a','btn s','🖼 Screenshot');z.href=i.proof;z.target='_blank';z.rel='noopener';a.append(z)}if(i.pay!='Done')a.append(bt('✏️ Amount '+(i.amt>0?'badlo':'set karo'),'s',()=>amtM(i)));a.append(bt('📋 Data','s',()=>details(i)));c.append(a);return c}
function plain(i){const c=mk('div','card'),r=mk('div','row'),rt=mk('div');r.append(head(i),rt);rt.append(mk('span','tag '+sCls(i.status),i.status),mk('span','tag '+pCls(i.pay),pLbl(i.pay)));c.append(r);
 if(i.ack){const k=mk('div','mt');k.append('Ack: ',mk('b',null,i.ack));k.append(' ');k.append(bt('Copy','s',function(){copy(i.ack,this)}));c.append(k)}
 const a=mk('div','acts');const qb=qBlock(i);if(qb)c.append(qb);a.append(bt('📋 Data','s',()=>details(i)),bt('✏️ Badlo','s',()=>editM(i)),bt('❓ Query','s',()=>raiseM(i)),bt('📤 Upload','s',()=>upM(i)));if(!held(i))a.append(bt('🔁 Review','s',()=>revM(i)));else a.append(bt('🔍 Verify karo','s f',()=>zipEdit(i,i.vs=='Review'?'rev':'ver')));const z=zipBtn(i);if(z)a.append(z);c.append(a);return c}

/* ---------- query / documents ---------- */
const b64=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(b)});
async function prep(f){if(f.type=='application/pdf'){if(f.size>4.5e6)throw new Error(f.name+': PDF 4.5MB se badi hai');return{n:f.name,t:'application/pdf',d:await b64(f)}}
 if(!f.type.startsWith('image/'))throw new Error(f.name+': sirf photo ya PDF chalegi');
 const bm=await createImageBitmap(f),k=Math.min(1,1800/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
 const bl=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));return{n:f.name.replace(/\.\w+$/,'')+'.jpg',t:'image/jpeg',d:await b64(bl)}}
function qMerge(i,r){Object.assign(i,{qs:r.qs,qt:r.qt,qf:r.qf,qu:r.qu});const k=ITEMS.findIndex(x=>x.id==i.id);if(k>=0)Object.assign(ITEMS[k],{qs:r.qs,qt:r.qt,qf:r.qf,qu:r.qu});else if(qAct(i))ITEMS.push(i);ITEMS=ITEMS.filter(x=>noAck(x)||payOpen(x)||qAct(x)||held(x));cacheSave();render()}
async function qdo(i,op,extra,msg){try{const r=await call('aq',{id:i.id,op,...extra},90000);if(!r.ok){toast('❌ '+(r.msg||'error'));return false}qMerge(i,r);toast('✅ '+msg);return true}catch(e){if(e.message!='auth')toast('❌ Net ya server ki dikkat, dobara try karo');return false}}
function fileLinks(i){const w=mk('div');(i.qf||[]).forEach((f,k)=>{const a=mk('a','btn s','📎 '+(f.n||'File '+(k+1)));a.href=f.u;a.target='_blank';a.rel='noopener';a.style.margin='4px 6px 0 0';w.append(a)});return w}
function raiseM(i){const b=mk('div');b.append(mk('div','nm','❓ Query uthao'),mk('div','mt',(i.name||'')+' · '+(i.center||'')));
 const t=mk('textarea');t.rows=4;t.placeholder='Center ko kya chahiye? (jaise: PAN pehle se bana hai, PAN card ki copy upload karo)';t.style.marginTop='10px';
 const pre=['PAN pehle se bana hua hai - PAN card ki copy upload karo','Aadhaar purana hai - Updated (naya) Aadhaar upload karo','Photo / Signature saaf nahi hai - dobara saaf upload karo','DOB proof chahiye - Birth certificate ya 10th marksheet upload karo','Address proof chahiye - upload karo','Documents clear nahi hain - dobara scan karke upload karo'];
 const ch=mk('div');ch.style.marginTop='10px';pre.forEach(x=>{const c=mk('span','chip',x.split(' - ')[0]);c.onclick=()=>{t.value=x};ch.append(c)});
